name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake pkg-config libx11-dev libxext-dev \
            libxcomposite-dev libxss-dev libpam0g-dev libxft-dev libxrandr-dev libxfixes-dev libxmu-dev libxmuu-dev
      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix="$HOME/.local/sbs-glasslock" --with-pam-service-name=sbs-glasslock-password
          make -j"$(nproc)"
